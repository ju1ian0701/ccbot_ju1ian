[project]
name = "ccbot"
version = "0.1.0"
description = "Telegram Bot for monitoring Claude Code sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "libtmux>=0.37.0",
    "Pillow>=10.0.0",
    "aiofiles>=24.0.0",
    "telegramify-markdown>=0.5.0,<1.0.0",
]

[project.scripts]
ccbot = "ccbot.main:main"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccbot"]

# Target Python 3.12
[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

# Pin the pre-0.16 default rule set (E4/E7/E9/F). Ruff 0.16 expanded defaults
# from 59 → 413 rules; without an explicit select, bare `ruff check` on 0.16+
# flags hundreds of pre-existing findings this repo has not adopted yet.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Point bare `pyright` / IDE at the project venv so third-party imports resolve
# without requiring `uv run` (system Python otherwise reports reportMissingImports).
[tool.pyright]
include = ["src/ccbot"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout: let bare `pytest` resolve `import ccbot` without an editable install
# (otherwise collection ERROR on every tests/ccbot/** file under system Python).
pythonpath = ["src"]
asyncio_mode = "auto"
# Explicit loop scope avoids pytest-asyncio deprecation (future default change).
asyncio_default_fixture_loop_scope = "function"
# Keep fewer basetemp trees — reduces Windows WinError 5 cleanup flakes.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
    "integration: tests using real filesystem or external processes",
]

[tool.coverage.run]
source = ["ccbot"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "logger\\.",
]
